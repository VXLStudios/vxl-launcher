name: Build and Release

on:
  push:
    tags:
      - "v*"  # Release on v* tags only
  workflow_dispatch: {} # Allow manual dispatch

jobs:
  # --- JOB 1: Build & Rename --- 
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: aarch64-apple-darwin
            output_path: ./src-tauri/target/aarch64-apple-darwin/release/bundle
            asset_name_base: VXL-Launcher-MacOS-arm64
          - platform: 'macos-latest'
            target: x86_64-apple-darwin
            output_path: ./src-tauri/target/x86_64-apple-darwin/release/bundle
            asset_name_base: VXL-Launcher-MacOS-x86_64
          - platform: 'ubuntu-22.04'
            target: '' # No explicit target for Linux x86_64
            output_path: ./src-tauri/target/release/bundle
            asset_name_base: VXL-Launcher-Linux
          - platform: 'windows-latest'
            target: '' # No explicit target for Windows x86_64
            output_path: ./src-tauri/target/release/bundle
            asset_name_base: VXL-Launcher-Windows-setup

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # GitHub runners default to azure.archive.ubuntu.com, which can hang indefinitely.
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
            fi
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Clean workspace (including node_modules)
        run: git clean -fdx

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean workspace (including node_modules)
        run: git clean -fdx

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          registry-url: https://npm.voxelstudios.co.uk
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VOXEL_NPM_TOKEN }}

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: yarn install --frozen-lockfile # Use yarn install

      # Tauri Action now handles build and sign
      - name: Build and Sign Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} # May be required internally by Tauri
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-Wl,--no-as-needed -C link-arg=-layatana-appindicator3 -C link-arg=-Wl,--as-needed' || '' }}
        with:
          # Revert to using packageManager and args
          args: --verbose ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} # Add --target if set
          tauriScript: yarn tauri

      - name: Fix AppImage (Remove Wayland libs & Resign)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          # Pass the secrets directly to the environment
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          echo "--- Fix AppImage Started ---"
          
          BUNDLE_DIR="$(pwd)/${{ matrix.output_path }}/appimage"
          cd "$BUNDLE_DIR"
          APPIMAGE=$(ls *.AppImage | head -n 1)
          echo "Target: $APPIMAGE"
          
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract > /dev/null
          
          echo "Removing conflicting libraries..."
          find squashfs-root -name "*wayland*" -delete

          echo "Fixing AppDir permissions (appimagetool requires world-readable executables)..."
          chmod -R a+rX squashfs-root
          if [ -f squashfs-root/AppRun.wrapped ]; then
            chmod a+rx squashfs-root/AppRun.wrapped
          fi
          if [ -f squashfs-root/AppRun ]; then
            chmod a+rx squashfs-root/AppRun
          fi
          
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          export ARCH=x86_64
          ./appimagetool-x86_64.AppImage squashfs-root/ "$APPIMAGE"
          
          echo "Re-signing..."
          
          cd - > /dev/null
          
          yarn tauri signer sign "$BUNDLE_DIR/$APPIMAGE"
          
          cd "$BUNDLE_DIR"
          rm -rf squashfs-root appimagetool-x86_64.AppImage
          
          echo "--- Fix Complete ---"
          
      # --- Rename and prepare artifacts --- 
      - name: Rename Linux Artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "--- Listing content BEFORE rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          ls -R "${{ matrix.output_path }}" || true
          echo "-----------------------------------"
          
          APP_BASE_NAME="VXL Launcher" # Your productName
          APPIMAGE_DIR=${{ matrix.output_path }}/appimage
          DEB_DIR=${{ matrix.output_path }}/deb
          
          echo "Listing content of $APPIMAGE_DIR and $DEB_DIR"
          ls -R "$APPIMAGE_DIR" || true
          ls -R "$DEB_DIR" || true
          
          # Move and rename AppImage (use simple wildcard)
          mv "$APPIMAGE_DIR"/*.AppImage "$APPIMAGE_DIR"/${{ matrix.asset_name_base }}.AppImage
          
          # Move and rename AppImage signature (use simple wildcard)
          mv "$APPIMAGE_DIR"/*.AppImage.sig "$APPIMAGE_DIR"/${{ matrix.asset_name_base }}.AppImage.sig
          
          # Move and rename Deb package
          mv "$DEB_DIR"/*.deb "$APPIMAGE_DIR"/${{ matrix.asset_name_base }}.deb
          
          # Move and rename Deb signature
          mv "$DEB_DIR"/*.deb.sig "$APPIMAGE_DIR"/${{ matrix.asset_name_base }}.deb.sig
          
          echo "Final content of $APPIMAGE_DIR after moves"
          ls -R "$APPIMAGE_DIR" || true
          
          echo "--- Listing content AFTER rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          ls -R "${{ matrix.output_path }}" || true
          echo "-----------------------------------"
        shell: bash
        
      - name: Rename Windows Artifacts
        if: matrix.platform == 'windows-latest'
        run: |
          echo "--- Listing content BEFORE rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          Get-ChildItem -Path "${{ matrix.output_path }}\release\bundle" -Recurse -ErrorAction SilentlyContinue
          echo "-----------------------------------"
          
          $ARTIFACT_DIR = "${{ matrix.output_path }}\nsis"
          echo "Listing content of $ARTIFACT_DIR"
          Get-ChildItem -Path $ARTIFACT_DIR -Recurse
          # Find the original names (assuming only one .exe and one .exe.sig)
          $ExeFile = Get-ChildItem -Path $ARTIFACT_DIR -Filter *.exe
          $SigFile = Get-ChildItem -Path $ARTIFACT_DIR -Filter *.exe.sig

          # Rename .exe
          Move-Item -Path $ExeFile.FullName -Destination "$ARTIFACT_DIR\${{ matrix.asset_name_base }}.exe"
          # Rename .exe.sig
          Move-Item -Path $SigFile.FullName -Destination "$ARTIFACT_DIR\${{ matrix.asset_name_base }}.exe.sig"

          echo "Final content of $ARTIFACT_DIR after move"
          Get-ChildItem -Path $ARTIFACT_DIR -Recurse
          
          echo "--- Listing content AFTER rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          Get-ChildItem -Path "${{ matrix.output_path }}" -Recurse -ErrorAction SilentlyContinue
          echo "-----------------------------------"
        shell: pwsh
        
      - name: Rename macOS Artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          echo "--- Listing content BEFORE rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          ls -R "${{ matrix.output_path }}" || true 
          echo "-----------------------------------"
          
          APP_BASE_NAME="VXL Launcher" # Your productName
          ARTIFACT_DIR_DMG=${{ matrix.output_path }}/dmg
          ARTIFACT_DIR_APP=${{ matrix.output_path }}/macos
          RENAMED_DIR="$ARTIFACT_DIR_APP/renamed"
          
          echo "Listing content of $ARTIFACT_DIR_DMG and $ARTIFACT_DIR_APP"
          ls -R "$ARTIFACT_DIR_DMG" || true
          ls -R "$ARTIFACT_DIR_APP" || true
          mkdir -p "$RENAMED_DIR"
          
          # Move DMG (Wildcard should be fine)
          mv "$ARTIFACT_DIR_DMG"/*.dmg "$RENAMED_DIR"/${{ matrix.asset_name_base }}.dmg
          
          # Move App Tarball (explicit name)
          mv "$ARTIFACT_DIR_APP/${APP_BASE_NAME}.app.tar.gz" "$RENAMED_DIR"/${{ matrix.asset_name_base }}.app.tar.gz
          
          # Move App Tarball signature (explicit name, ignore errors)
          mv "$ARTIFACT_DIR_APP/${APP_BASE_NAME}.app.tar.gz.sig" "$RENAMED_DIR"/${{ matrix.asset_name_base }}.app.tar.gz.sig
          
          echo "Final content of $RENAMED_DIR after move"
          ls -R "$RENAMED_DIR" || true
          
          echo "--- Listing content AFTER rename ---"
          echo "Output path: ${{ matrix.output_path }}"
          ls -R "${{ matrix.output_path }}" || true
          echo "-----------------------------------"
        shell: bash

      # --- Upload artifacts --- 
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'ubuntu-22.04'
        with:
          name: artifact-${{ matrix.platform }}
          path: ${{ matrix.output_path }}/appimage/${{ matrix.asset_name_base }}.*
          if-no-files-found: error

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: artifact-${{ matrix.platform }}
          path: ${{ matrix.output_path }}\nsis\${{ matrix.asset_name_base }}.*
          if-no-files-found: error
          
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos-latest'
        with:
          name: artifact-${{ matrix.platform }}-${{ matrix.target }}
          path: ${{ matrix.output_path }}/macos/renamed/${{ matrix.asset_name_base }}.*
          if-no-files-found: error

  # --- JOB 2: Create Release --- 
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build # Dependency on build job
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for release creation
    steps:
      - name: Checkout repository (needed for release notes maybe)
        uses: actions/checkout@v4 
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts to a subdirectory
          # No explicit name, downloads all uploaded artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }} # Uses the tag that triggered the workflow
          name: Release ${{ github.ref_name }} # Name of the release
          body: | # Optional: Release Notes
            Automated release for tag ${{ github.ref_name }}
            See assets below.
          draft: false
          # Set to true if tag contains '-alpha', '-beta' or '-rc'
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: artifacts/**/* # Upload all downloaded artifacts

      # --- Step: Notify Production Backend --- 
      - name: Notify Production Backend
        if: success() # Only if release creation was successful
        run: |
          echo "Sending notification to PRODUCTION backend for tag ${{ github.ref_name }}"
          curl -fsS -X POST \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer ${{ secrets.BACKEND_API_KEY }}" \
               -d "{\"ref_name\":\"${{ github.ref_name }}\"}" \
               "${{ secrets.RELEASE_UPDATE_API_URL }}"
        shell: bash

  # --- JOB 3: Notify Staging Backend ---
  notify_staging: # New job for Staging/Manual
    # Runs on push to staging OR on manual start
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: build # Ensures builds are completed (or failed)
    steps:
      - name: Notify Staging Backend
        run: |
          echo "Sending notification to STAGING backend for ref ${{ github.ref_name }}"
          curl -fsS -X POST \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer ${{ secrets.BACKEND_API_KEY }}" \
               -d "{\"ref_name\":\"${{ github.ref_name }}\"}" \
               "${{ secrets.BETA_UPDATE_API_URL }}"
        shell: bash
